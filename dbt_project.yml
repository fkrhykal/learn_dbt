name: learn_dbt

profile: learn_dbt

seed-paths: ["seeds"]
model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
analysis-paths: ["analyses"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  learn_dbt:
    +static_analysis: strict
    bronze:
      +materialized: table
      +schema: bronze
    silver:
      +materialized: table
      +schema: silver
    gold:
      +materialized: table
      +schema: gold

seeds:
  learn_dbt:
    +static_analysis: strict
    +schema: bronze

analyses:
  learn_dbt:
    +static_analysis: baseline
